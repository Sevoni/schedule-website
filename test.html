<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальный сервер расписания (Браузерная версия)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; text-align: center; color: #2e7d32; margin-top: 0; }
        #status { color: #666; font-style: italic; text-align: center; margin-bottom: 15px; font-size: 14px; }
        .btn { padding: 10px 15px; background: #2e7d32; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: bold; }
        .btn:active { background: #1b5e20; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; align-items: center; }
        input[type="text"] { padding: 9px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; width: 120px; text-align: center; }
        #output { margin-top: 15px; white-space: pre-wrap; font-family: monospace; background: #fafafa; padding: 10px; border: 1px solid #ddd; height: 350px; overflow-y: auto; font-size: 12px; }
        .hw-box { margin-top: 20px; padding: 15px; border-top: 2px dashed #ccc; }
        textarea { width: 100%; height: 60px; margin-top: 5px; box-sizing: border-box; padding: 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Расписание campus.syktsu.ru</h1>
    <div id="status">Готов к отправке прямого запроса (требуется CORS-расширение)</div>
    
    <div class="controls">
        <label for="groupInput">Группа:</label>
        <input type="text" id="groupInput" value="131-ИБо">
        <button class="btn" onclick="runGetSchedule()">Загрузить</button>
    </div>
    
    <div id="output">Здесь появится точный JSON результат работы парсера...</div>

    <!-- Замена работы с homework.json через LocalStorage телефона -->
    <div class="hw-box">
        <h3>📝 Домашнее задание (Локальное хранилище)</h3>
        <textarea id="hwInput" placeholder="Введите список домашних заданий в формате текста или JSON..."></textarea>
        <div style="margin-top: 8px; display: flex; gap: 10px;">
            <button class="btn" style="background:#555;" onclick="saveHomework()">Сохранить ДЗ</button>
            <button class="btn" style="background:#999;" onclick="loadHomework()">Загрузить ДЗ</button>
        </div>
    </div>
</div>

<script>
const CAMPUS_URL = "https://campus.syktsu.ru/schedule/group/";

// 1. Очистка текста (Символ в символ как def clean(text) в вашем Python)
function clean(text) {
    if (!text) return "";
    let t = text.replace(/<br\s*\/?>/gi, "\n");
    t = t.replace(/<[^>]+>/g, "");
    t = t.replace(/&nbsp;/g, " ");
    t = t.replace(/\n\s*\n/g, "\n");
    return t.trim();
}

// 2. Определение типа пары (Символ в символ как def ptype(subj) в вашем Python)
function ptype(subj) {
    const m = subj.match(/\((л|пр|пз|лаб|с)\)/);
    if (!m) return "";
    const typeMap = {"л": "лекция", "пр": "практика", "пз": "практическое занятие", "лаб": "лабораторная", "с": "семинар"};
    return typeMap[m[1]] || m[1];
}

// 3. Разбор одной ячейки таблицы (Символ в символ как def parse_cell(text) в вашем Python)
function parseCell(text) {
    const lines = text.split("\n").map(l => l.trim()).filter(l => l);
    const subj = lines.length > 0 ? lines[0] : "";
    let tea = "", rm = "";
    
    if (lines.length > 1) {
        const last = lines[lines.length - 1];
        const rm_m = last.match(/(\d+\/\d+|\d+)$/);
        if (rm_m) {
            rm = rm_m[1];
            tea = last.substring(0, rm_m.index).trim().replace(/,$/, "").trim();
        } else {
            tea = last;
        }
    }
    return { "subject": subj, "teacher": tea, "room": rm, "type": ptype(subj) };
}

// 4. Главный парсер расписания на базе ваших регулярных выражений из Python
function parseSchedule(html, groupName) {
    const R = {
        "group": "",
        "weekStart": "",
        "weekEnd": "",
        "days": {},
        "parsedAt": new Date().toISOString()
    };
    
    const hm = html.match(/на\s+неделю\s+c\s+(\d{2}\.\d{2}\.\d{4})\s+по\s+(\d{2}\.\d{2}\.\d{4})/);
    if (hm) {
        R["weekStart"] = hm[1];
        R["weekEnd"] = hm[2];
    }
    
    const gm = html.match(/для\s+группы\s+([^\s<]+)/);
    if (gm) {
        R["group"] = gm[1];
    } else {
        R["group"] = groupName;
    }
    
    const tm = html.match(/<table\s[^>]*class="schedule"[^>]*>([\s\S]*?)<\/table>/);
    if (!tm) return R;
    
    const raw = tm[1];
    
    // Ищем заголовки дней недели через RegExp регулярку из Python скрипта
    const dhsRegex = /class="dayofweek[^"]*"[^>]*>([^<]*)<br>\((\d{2}\.\d{2}\.\d{4})\)/g;
    let dhs = [];
    let match;
    while ((match = dhsRegex.exec(raw)) !== null) {
        dhs.push({
            text: match[1],
            date: match[2],
            start: match.index,
            end: dhsRegex.lastIndex
        });
    }
    
    for (let i = 0; i < dhs.length; i++) {
        const dm = dhs[i];
        const dn = clean(dm.text);
        const dd = dm.date;
        
        const cs = dm.end;
        const ce = (i + 1 < dhs.length) ? dhs[i + 1].start : raw.length;
        const dc = raw.substring(cs, ce);
        
        const pairs = [];
        // Регулярка для вытаскивания пар из ячеек таблицы
        const pmRegex = /<td>(\d)<\/td><td>(\d{2}:\d{2})<\/td>([\s\S]*?)(?=<td>\d<\/td>|<\/tr>)/g;
        let pMatch;
        
        while ((pMatch = pmRegex.exec(dc)) !== null) {
            const n = parseInt(pMatch[1]);
            const t = pMatch[2];
            const rest = pMatch[3];
            
            let s = "", te = "", r = "", ty = "";
            
            const cm = rest.match(/<td\s+colspan="2">([\s\S]*?)<\/td>/);
            if (cm) {
                const p = parseCell(clean(cm[1]));
                s = p.subject; te = p.teacher; r = p.room; ty = p.type;
            } else {
                const tdRegex = /<td[^>]*>([\s\S]*?)<\/td>/g;
                let cols = [];
                let tdMatch;
                while ((tdMatch = tdRegex.exec(rest)) !== null) {
                    cols.push(clean(tdMatch[1]));
                }
                if (cols.length >= 2) {
                    const p = parseCell(cols[0] || cols[1]);
                    s = p.subject; te = p.teacher; r = p.room; ty = p.type;
                }
            }
            pairs.push({ "num": n, "time": t, "subject": s, "teacher": te, "room": r, "type": ty });
        }
        R["days"][dn] = { "date": dd, "pairs": pairs };
    }
    return R;
}

// 5. Функция POST отправки данных формы на сайт вуза
async function fetchSchedule(group) {
    const formData = new URLSearchParams();
    formData.append('num_group', group);
    formData.append('searchdata', 'ИСКАТЬ');

    const response = await fetch(CAMPUS_URL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
        },
        body: formData.toString()
    });

    if (!response.ok) {
        throw new Error(`Сетевой сбой при ответе сайта вуза: ${response.status}`);
    }
    return await response.text();
}

// Главный управляющий триггер для запуска разбора данных
async function runGetSchedule() {
    const statusDiv = document.getElementById('status');
    const outputDiv = document.getElementById('output');
    const groupValue = document.getElementById('groupInput').value.trim() || GROUP_DEFAULT;
    
    statusDiv.innerText = `Подключение напрямую к СыктГУ для группы ${groupValue}...`;
    outputDiv.innerText = "Ожидание HTML кода страницы...";
    
    try {
        const html = await fetchSchedule(groupValue);
        statusDiv.innerText = "HTML успешно скачан. Запуск регулярных выражений...";
        
        const finalJsonData = parseSchedule(html, groupValue);
        
        // Выводит на экран точный красивый форматированный JSON текст
        outputDiv.innerText = JSON.stringify(finalJsonData, null, 2);
        statusDiv.innerText = `Расписание для "${groupValue}" успешно выведено на экран!`;
    } catch (error) {
        statusDiv.innerText = "Произошла ошибка выполнения скрипта";
        outputDiv.innerText = `Не удалось спарсить данные.\n\nДетали: ${error.message}\n\nУбедитесь, что вы запустили файл в браузере с поддержкой CORS (например, Kiwi Browser + плагин CORS).`;
    }
}

// 6. Реализация логики сохранения ДЗ (замена def save_hw / def load_hw)
function saveHomework() {
    const val = document.getElementById('hwInput').value;
    localStorage.setItem('campus_homework', val);
    alert('Домашнее задание сохранено в память телефона!');
}

function loadHomework() {
    const saved = localStorage.getItem('campus_homework');
    document.getElementById('hwInput').value = saved ? saved : '[]';
}

// При первом запуске страницы автоматически подгружаем сохраненную домашку
window.onload = loadHomework;
</script>
</body>
</html>
