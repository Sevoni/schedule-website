<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ct">
    <header>
      <div class="ht">
        <h1>📅 Расписание</h1>
        <div style="display:flex; align-items:center; gap:8px;">
          <button id="syncBtn" class="ib" title="Загрузить расписание">🔄</button>
          <button id="settingsBtn" class="ib" title="Настройки">⚙️</button>
        </div>
      </div>
      <div id="syncStatus" class="ss"></div>
      <div class="gi">
        <span id="groupName" class="gn">131-ИБо</span>
        <span id="weekRange" class="wr"></span>
      </div>
    </header>

    <nav class="wn">
      <button id="prevWeek" class="nb">◀</button>
      <span id="wl">Загрузка...</span>
      <button id="nextWeek" class="nb">▶</button>
    </nav>

    <nav id="dayTabs" class="dt"></nav>

    <main id="scheduleContent" class="sc">
      <div class="ld">Загрузка...</div>
    </main>

    <section class="hs">
      <div class="hh">
        <h2>📝 Домашние задания</h2>
        <button id="addHwBtn" class="ab">+ Добавить</button>
      </div>
      <div id="hwList" class="hl"></div>
    </section>
  </div>

  <!-- Модалка настроек -->
  <div id="settingsModal" class="mo hidden">
    <div class="mc">
      <div class="mh">
        <h2>Настройки</h2>
        <button id="closeSet" class="ib">✕</button>
      </div>
      <div class="mb">
        <label>Группа
          <input type="text" id="groupIn" placeholder="131-ИБо">
        </label>
        <button id="saveSet" class="sb">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Модалка добавления ДЗ -->
  <div id="hwModal" class="mo hidden">
    <div class="mc">
      <div class="mh">
        <h2>Новое задание</h2>
        <button id="closeHw" class="ib">✕</button>
      </div>
      <div class="mb">
        <label>Предмет
          <input type="text" id="hwSubj" placeholder="Математика">
        </label>
        <label>Задание
          <textarea id="hwTask" rows="3" placeholder="Выполнить упражнения 1-5..."></textarea>
        </label>
        <label>Сдать до
          <input type="date" id="hwDue">
        </label>
        <button id="saveHw" class="sb">Добавить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
