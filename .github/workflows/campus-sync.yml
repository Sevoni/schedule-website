name: Campus sync (proxy parse)

# Парсинг расписания campus.syktsu.ru через прокси Яндекс.Перевода
# (translated.turbopages.org). Кампус принимает запросы только из России,
# поэтому HTML качается через прокси-путь (GET + query-параметры).
# Скрипт: site/scripts/campus-sync/sync.js — mint хэша, fetch, парсинг, сводка.
#
# Парсится ТОЛЬКО текущая неделя: кампус отдаёт её прямо в ответе на
# searchdata=ИСКАТЬ, поэтому запросов всего два (префикс + страница).
# Будущие недели кампус отдаёт только через POST, который прокси Яндекса
# не пропускает, — они обновляются из браузеров пользователей (из России).
#
# ВАЖНО: mint-шаг (translate.yandex.com) режет капчей не-российские IP,
# поэтому в CI он НЕ работает. Префикс минтится один раз на российской
# машине и хранится в repository variable CAMPUS_PROXY_PREFIX
# (Settings → Secrets and variables → Actions → Variables). Обновление:
#   node site/scripts/campus-sync/sync.js --mint --set-variable <owner/repo>
# (нужен gh auth), либо вставьте префикс вручную в переменную.
#
# Сейчас это ТОЛЬКО проверка парсинга: скрипт ничего не пишет в API сайта.
# Показывает в логах недели/пары. Интеграция (запись в D1) добавится позже.

on:
  schedule:
    - cron: '0 */4 * * *'   # каждые 4 часа
  workflow_dispatch:         # ручной запуск (кнопка "Run workflow")

concurrency:
  group: campus-sync
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Parse campus schedule via Yandex proxy
        env:
          # Группа — переопределяется переменной репозитория
          # (Settings → Variables), по умолчанию 131-ИБо.
          GROUP: ${{ vars.CAMPUS_GROUP || '131-ИБо' }}
          # Заминтированный на российской машине прокси-префикс
          # (см. шапку файла: node sync.js --mint --set-variable owner/repo).
          CAMPUS_PROXY_PREFIX: ${{ vars.CAMPUS_PROXY_PREFIX }}
        run: node site/scripts/campus-sync/sync.js
