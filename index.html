<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--sf:#1a1d27;--sh:#222632;--bd:#2a2e3a;--tx:#e4e6ed;--dm:#8b8fa3;--ac:#6c8cff;--gn:#4ade80;--rd:#f87171;--or:#fbbf24;--r:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.ct{max-width:600px;margin:0 auto;padding:16px}
header{margin-bottom:16px}
.ht{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ht h1{font-size:1.5rem;font-weight:700}
.ib{background:none;border:none;color:var(--dm);font-size:1.2rem;cursor:pointer;padding:8px;border-radius:8px}
.ib:hover{background:var(--sf);color:var(--tx)}
.gi{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gn{font-weight:600;color:var(--ac);font-size:1.1rem}
.wr{color:var(--dm);font-size:.85rem}
.ss{font-size:.8rem;padding:4px 0;display:flex;align-items:center;gap:6px}
.ss.syncing{color:var(--ac)}.ss.ok{color:var(--gn)}.ss.error{color:var(--rd)}
.si{display:inline-block}.si.sp{animation:sp 1s linear infinite}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sr{background:none;border:none;color:var(--ac);cursor:pointer;text-decoration:underline;font-size:inherit;padding:0}
.wn{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;background:var(--sf);border-radius:var(--r);margin-bottom:12px}
.nb{background:none;border:1px solid var(--bd);color:var(--tx);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:.9rem}
.nb:hover{background:var(--ac);border-color:var(--ac)}
#wl{font-size:.9rem;color:var(--dm)}
.dt{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
.dt::-webkit-scrollbar{display:none}
.dp{flex-shrink:0;padding:8px 14px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);color:var(--dm);cursor:pointer;font-size:.85rem;transition:all .2s}
.dp:hover{background:var(--sh);color:var(--tx)}
.dp.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.dp.td{border-color:var(--ac)}
.sc{min-height:200px}
.ld{text-align:center;padding:40px;color:var(--dm)}
.ds{}
.dh{font-size:1.1rem;font-weight:600;margin-bottom:12px}
.dd{font-weight:400;color:var(--dm);font-size:.85rem;margin-left:8px}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:8px;transition:border-color .2s}
.pc:hover{border-color:var(--ac)}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pn{background:var(--ac);color:#fff;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.ptm{color:var(--dm);font-size:.85rem;font-variant-numeric:tabular-nums}
.ptp{font-size:.75rem;padding:2px 8px;border-radius:6px;font-weight:500}
.ptp.l{background:#1e3a5f;color:#60a5fa}.ptp.pr{background:#1a3a2a;color:#4ade80}.ptp.lb{background:#3a2a1a;color:#fbbf24}.ptp.s{background:#2a1a3a;color:#c084fc}
.ps{font-weight:600;font-size:.95rem;margin-bottom:4px}
.ptc{color:var(--dm);font-size:.85rem}
.pr{color:var(--dm);font-size:.85rem}.pr::before{content:'🚪 '}
.np{text-align:center;padding:40px;color:var(--dm);font-size:.95rem}
.em{text-align:center;padding:24px;color:var(--rd);background:var(--sf);border-radius:var(--r);border:1px solid var(--rd)}
.em button{margin-top:12px;padding:8px 20px;background:var(--rd);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem}
.hs{margin-top:24px;border-top:1px solid var(--bd);padding-top:20px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hh h2{font-size:1.1rem}
.ab{padding:6px 14px;background:var(--ac);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:500}
.ab:hover{opacity:.85}
.hl{display:flex;flex-direction:column;gap:8px}
.hc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hc.overdue{border-color:var(--rd)}.hc.due-soon{border-color:var(--or)}
.hi{flex:1;min-width:0}
.hsb{font-weight:600;font-size:.9rem;margin-bottom:2px}
.hsk{color:var(--dm);font-size:.85rem;word-break:break-word}
.hdu{font-size:.8rem;color:var(--or);margin-top:4px}.hdu.overdue{color:var(--rd)}
.hdl{background:none;border:none;color:var(--dm);cursor:pointer;font-size:1.1rem;padding:4px;border-radius:6px;flex-shrink:0}
.hdl:hover{color:var(--rd);background:rgba(248,113,113,.1)}
.nh{text-align:center;padding:20px;color:var(--dm);font-size:.9rem}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mo.hidden{display:none}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);width:100%;max-width:400px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--bd)}
.mh h2{font-size:1rem}
.mb{padding:16px;display:flex;flex-direction:column;gap:12px}
.mb label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--dm)}
.mb input,.mb textarea{padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:.9rem;font-family:inherit;resize:vertical}
.mb input:focus,.mb textarea:focus{outline:none;border-color:var(--ac)}
.sb{padding:10px;background:var(--ac);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
.sb:hover{opacity:.85}
@media(max-width:400px){.ct{padding:10px}.dp{padding:6px 10px;font-size:.8rem}}
</style>
</head>
<body>
<div class="ct">
  <header>
    <div class="ht">
      <h1>📅 Расписание</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="syncBtn" class="ib" title="Загрузить расписание">🔄</button>
        <button id="settingsBtn" class="ib" title="Настройки">⚙️</button>
      </div>
    </div>
    <div id="syncStatus" class="ss"></div>
    <div class="gi">
      <span id="groupName" class="gn">131-ИБо</span>
      <span id="weekRange" class="wr"></span>
    </div>
  </header>

  <nav class="wn">
    <button id="prevWeek" class="nb">◀</button>
    <span id="wl">Загрузка...</span>
    <button id="nextWeek" class="nb">▶</button>
  </nav>

  <nav id="dayTabs" class="dt"></nav>

  <main id="scheduleContent" class="sc">
    <div class="ld">Загрузка...</div>
  </main>

  <section class="hs">
    <div class="hh">
      <h2>📝 Домашние задания</h2>
      <button id="addHwBtn" class="ab">+ Добавить</button>
    </div>
    <div id="hwList" class="hl"></div>
  </section>
</div>

<div id="settingsModal" class="mo hidden">
  <div class="mc">
    <div class="mh"><h2>Настройки</h2><button id="closeSet" class="ib">✕</button></div>
    <div class="mb">
      <label>Группа<input type="text" id="groupIn" placeholder="131-ИБо"></label>
      <button id="saveSet" class="sb">Сохранить</button>
    </div>
  </div>
</div>

<div id="hwModal" class="mo hidden">
  <div class="mc">
    <div class="mh"><h2>Новое задание</h2><button id="closeHw" class="ib">✕</button></div>
    <div class="mb">
      <label>Предмет<input type="text" id="hwSubj" placeholder="Математика"></label>
      <label>Задание<textarea id="hwTask" rows="3" placeholder="Выполнить упражнения 1-5..."></textarea></label>
      <label>Сдать до<input type="date" id="hwDue"></label>
      <button id="saveHw" class="sb">Добавить</button>
    </div>
  </div>
</div>

<script>
const G='131-ИБо',DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'],DS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const CAMPUS_URL='https://campus.syktsu.ru/schedule/group/';
let S={group:localStorage.getItem('group')||G,schedule:null,weeks:[],weekIdx:-1,selDay:null,hw:[],syncing:false};

function clean(t){
  if(!t)return'';
  t=t.replace(/<br\s*\/?>/gi,'\n');
  t=t.replace(/<[^>]+>/g,'');
  t=t.replace(/&nbsp;/g,' ');
  t=t.replace(/\n\s*\n/g,'\n');
  return t.trim();
}

function ptype(s){
  const m=s.match(/\((л|пр|пз|лаб|с)\)/);
  if(!m)return'';
  return{л:'лекция',пр:'практика',пз:'практическое занятие',лаб:'лабораторная',с:'семинар'}[m[1]]||m[1];
}

function parseCell(t){
  const lines=t.split('\n').map(l=>l.trim()).filter(l=>l);
  const subj=lines[0]||'';
  let tea='',rm='';
  if(lines.length>1){
    const last=lines[lines.length-1];
    const rm_m=last.match(/(\d+\/\d+|\d+)$/);
    if(rm_m){rm=rm_m[1];tea=last.substring(0,rm_m.index).trim().replace(/,$/,'').trim();}
    else tea=last;
  }
  return{subject:subj,teacher:tea,room:rm,type:ptype(subj)};
}

async function campusPost(group,extra){
  const fd=new URLSearchParams();
  fd.append('num_group',group);
  if(extra){for(const[k,v]of Object.entries(extra))fd.append(k,v);}
  else fd.append('searchdata','ИСКАТЬ');
  const r=await fetch(CAMPUS_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:fd.toString()});
  if(!r.ok)throw new Error('Сетевой сбой: '+r.status);
  return await r.text();
}

function parseWeeks(html){
  const sm=html.match(/<select\s+name="weeks"[^>]*>([\s\S]*?)<\/select>/);
  if(!sm)return[];
  const opts=[];
  const re=/<option\s+value="(\d+_[^"]+)"[^>]*>([\s\S]*?)<\/option>/g;
  let m;
  while((m=re.exec(sm[1]))!==null){
    const text=clean(m[2]);
    const dates=text.match(/\d{2}\.\d{2}\.\d{4}/g)||[];
    opts.push({value:m[1],text:text,weekNum:m[1].split('_')[0],dates:dates});
  }
  return opts;
}

function parseSchedule(html){
  const R={group:'',weekStart:'',weekEnd:'',days:{},parsedAt:new Date().toISOString()};
  const hm=html.match(/на\s+неделю\s+c\s+(\d{2}\.\d{2}\.\d{4})\s+по\s+(\d{2}\.\d{2}\.\d{4})/);
  if(hm){R.weekStart=hm[1];R.weekEnd=hm[2];}
  const gm=html.match(/для\s+группы\s+([^\s<]+)/);
  if(gm)R.group=gm[1];else R.group=S.group;
  const tm=html.match(/<table\s[^>]*class="schedule"[^>]*>([\s\S]*?)<\/table>/);
  if(!tm)return R;
  const raw=tm[1];
  const dhsRegex=/class="dayofweek[^"]*"[^>]*>([^<]*)<br>\((\d{2}\.\d{2}\.\d{4})\)/g;
  let dhs=[];let match;
  while((match=dhsRegex.exec(raw))!==null)dhs.push({text:match[1],date:match[2],start:match.index,end:dhsRegex.lastIndex});
  for(let i=0;i<dhs.length;i++){
    const dm=dhs[i];const dn=clean(dm.text);const dd=dm.date;
    const cs=dm.end;const ce=(i+1<dhs.length)?dhs[i+1].start:raw.length;const dc=raw.substring(cs,ce);
    const pairs=[];const pmRegex=/<td>(\d)<\/td><td>(\d{2}:\d{2})<\/td>([\s\S]*?)(?=<td>\d<\/td>|<\/tr>)/g;let pMatch;
    while((pMatch=pmRegex.exec(dc))!==null){
      const n=parseInt(pMatch[1]),t=pMatch[2],rest=pMatch[3];
      let s='',te='',r='',ty='';
      const cm=rest.match(/<td\s+colspan="2">([\s\S]*?)<\/td>/);
      if(cm){const p=parseCell(clean(cm[1]));s=p.subject;te=p.teacher;r=p.room;ty=p.type;}
      else{const tdRegex=/<td[^>]*>([\s\S]*?)<\/td>/g;let cols=[];let tdMatch;
        while((tdMatch=tdRegex.exec(rest))!==null)cols.push(clean(tdMatch[1]));
        if(cols.length>=2){const p=parseCell(cols[0]||cols[1]);s=p.subject;te=p.teacher;r=p.room;ty=p.type;}}
      pairs.push({num:n,time:t,subject:s,teacher:te,room:r,type:ty});
    }
    R.days[dn]={date:dd,pairs:pairs};
  }
  return R;
}

function pd(s){const[a,b,c]=s.split('.');return new Date(+c,+b-1,+a);}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function enc(s){return encodeURIComponent(s);}

document.addEventListener('DOMContentLoaded',()=>{
  loadHwUI();setupSet();setupHw();
  document.getElementById('syncBtn').onclick=doSync;
  loadAll();
});

async function loadAll(){
  try{
    const html=await campusPost(S.group);
    S.weeks=parseWeeks(html);
    findWeek();
    renderWeekNav();
    const weekVal=S.weeks[S.weekIdx]?.value;
    let scheduleHtml=html;
    if(weekVal){scheduleHtml=await campusPost(S.group,{weeks:weekVal,searchdata:'ИСКАТЬ'});}
    S.schedule=parseSchedule(scheduleHtml);
    document.getElementById('groupName').textContent=S.schedule.group||S.group;
    if(S.schedule.weekStart)document.getElementById('weekRange').textContent=S.schedule.weekStart+' — '+S.schedule.weekEnd;
    renderDays();
  }catch(e){
    document.getElementById('scheduleContent').innerHTML='<div class="em">'+esc(e.message)+'<br><button onclick="doSync()">Повторить</button></div>';
  }
}

async function doSync(){
  if(S.syncing)return;S.syncing=true;setSync('syncing');
  try{await loadAll();setSync('ok');}catch(e){setSync('error',e.message);}finally{S.syncing=false;}
}

function findWeek(){
  const now=new Date();let f=-1;
  for(let i=0;i<S.weeks.length;i++){const w=S.weeks[i];if(w.dates.length>=2){const a=pd(w.dates[0]),b=pd(w.dates[1]);if(now>=a&&now<=b){f=i;break;}}}
  S.weekIdx=f>=0?f:0;
}

function renderWeekNav(){
  document.getElementById('wl').textContent=S.weeks[S.weekIdx]?.text||'Нет данных';
  document.getElementById('prevWeek').onclick=()=>{if(S.weekIdx>0){S.weekIdx--;renderWeekNav();loadWeek();}};
  document.getElementById('nextWeek').onclick=()=>{if(S.weekIdx<S.weeks.length-1){S.weekIdx++;renderWeekNav();loadWeek();}};
}

async function loadWeek(){
  try{
    const weekVal=S.weeks[S.weekIdx]?.value;
    const html=await campusPost(S.group,weekVal?{weeks:weekVal,searchdata:'ИСКАТЬ'}:null);
    S.schedule=parseSchedule(html);
    document.getElementById('groupName').textContent=S.schedule.group||S.group;
    if(S.schedule.weekStart)document.getElementById('weekRange').textContent=S.schedule.weekStart+' — '+S.schedule.weekEnd;
    renderDays();
  }catch(e){}
}

function renderDays(){
  const tabs=document.getElementById('dayTabs');
  const days=Object.keys(S.schedule.days);
  const tn=DAYS[new Date().getDay()===0?6:new Date().getDay()-1];
  let def=days[0];for(const d of days)if(S.schedule.days[d].pairs.some(p=>p.subject)){def=d;break;}
  if(!S.selDay||!days.includes(S.selDay))S.selDay=days.includes(tn)?tn:def;
  const key=days.join(',');
  if(tabs.dataset.key!==key){
    tabs.dataset.key=key;tabs.innerHTML='';
    days.forEach(day=>{
      const t=document.createElement('button');t.className='dp';
      if(day===S.selDay)t.classList.add('on');if(day===tn)t.classList.add('td');
      const di=DAYS.indexOf(day);t.textContent=di>=0?DS[di]:day.slice(0,2);
      t.title=day+' ('+S.schedule.days[day].date+')';
      t.onclick=()=>{S.selDay=day;document.querySelectorAll('.dp').forEach(x=>x.classList.remove('on'));t.classList.add('on');renderDay(day);};
      tabs.appendChild(t);
    });
  }else{tabs.querySelectorAll('.dp').forEach(t=>{
    const di=DS.indexOf(t.textContent);const day=di>=0?DAYS[di]:t.title.split(' (')[0];
    t.classList.toggle('on',day===S.selDay);
  });}
  renderDay(S.selDay);
}

function renderDay(day){
  const c=document.getElementById('scheduleContent'),dd=S.schedule.days[day];
  if(!dd){c.innerHTML='<div class="np">Нет данных</div>';return;}
  const ap=dd.pairs.filter(p=>p.subject);
  const key=day+dd.date+ap.length;
  if(c.dataset.key===key)return;c.dataset.key=key;
  let h='';
  if(!ap.length)h='<div class="np">Нет пар 🎉</div>';
  else for(const p of ap){
    const tc=p.type?(p.type.includes('лекц')?'l':p.type.includes('лабор')?'lb':p.type.includes('семинар')?'s':'pr'):'';
    h+=`<div class="pc"><div class="ptop"><div style="display:flex;align-items:center;gap:8px"><span class="pn">${p.num}</span><span class="ptm">${p.time}</span></div>${p.type?`<span class="ptp ${tc}">${p.type}</span>`:''}</div><div class="ps">${esc(p.subject)}</div>${p.teacher?`<div class="ptc">${esc(p.teacher)}</div>`:''}${p.room?`<div class="pr">${esc(p.room)}</div>`:''}</div>`;
  }
  c.innerHTML=`<div class="ds"><div class="dh">${day}<span class="dd">${dd.date}</span></div>${h}</div>`;
}

function setSync(st,msg){
  const el=document.getElementById('syncStatus');
  if(st==='syncing'){el.innerHTML='<span class="si sp">⟳</span> Загрузка...';el.className='ss syncing';}
  else if(st==='ok'){el.innerHTML='<span class="si">✓</span> '+new Date().toLocaleTimeString('ru');el.className='ss ok';}
  else if(st==='error'){el.innerHTML='<span class="si">✕</span> '+esc(msg);el.className='ss error';}
}

function loadHwUI(){
  const l=document.getElementById('hwList'),now=new Date();now.setHours(0,0,0,0);
  const sorted=[...S.hw].sort((a,b)=>{if(!a.due)return 1;if(!b.due)return-1;return new Date(a.due)-new Date(b.due);});
  if(!sorted.length){l.innerHTML='<div class="nh">Нет заданий</div>';return;}
  l.innerHTML=sorted.map(hw=>{
    let cc='',dc='',dt='';
    if(hw.due){const d=new Date(hw.due);d.setHours(0,0,0,0);const df=Math.ceil((d-now)/864e5);
      if(df<0){cc='overdue';dc='overdue';dt='Просрочено';}else if(df===0){cc='due-soon';dt='Сегодня!';}else if(df<=2){cc='due-soon';dt='Через '+df+' дн.';}else dt=hw.due;}
    return`<div class="hc ${cc}"><div class="hi"><div class="hsb">${esc(hw.subj)}</div><div class="hsk">${esc(hw.task)}</div>${dt?`<div class="hdu ${dc}">${dt}</div>`:''}</div><button class="hdl" data-id="${hw.id}">✕</button></div>`;
  }).join('');
  l.querySelectorAll('.hdl').forEach(b=>{b.onclick=()=>{S.hw=S.hw.filter(h=>h.id!==b.dataset.id);saveHw();loadHwUI();};});
}

function saveHw(){localStorage.setItem('hw',JSON.stringify(S.hw));}

function setupSet(){
  const m=document.getElementById('settingsModal');
  document.getElementById('settingsBtn').onclick=()=>{document.getElementById('groupIn').value=S.group;m.classList.remove('hidden');};
  document.getElementById('closeSet').onclick=()=>m.classList.add('hidden');
  m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};
  document.getElementById('saveSet').onclick=()=>{S.group=document.getElementById('groupIn').value.trim()||G;localStorage.setItem('group',S.group);m.classList.add('hidden');S.selDay=null;};
}

function setupHw(){
  const m=document.getElementById('hwModal');
  document.getElementById('addHwBtn').onclick=()=>{document.getElementById('hwSubj').value='';document.getElementById('hwTask').value='';document.getElementById('hwDue').value='';m.classList.remove('hidden');document.getElementById('hwSubj').focus();};
  document.getElementById('closeHw').onclick=()=>m.classList.add('hidden');
  m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};
  document.getElementById('saveHw').onclick=()=>{const s=document.getElementById('hwSubj').value.trim(),t=document.getElementById('hwTask').value.trim(),d=document.getElementById('hwDue').value;if(!s)return;S.hw.push({id:Date.now().toString(36),subj:s,task:t,due:d});saveHw();loadHwUI();m.classList.add('hidden');};
}
</script>
</body>
</html>
