name = "schedule-worker"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
CAMPUS_URL = "https://campus.syktsu.ru/schedule/group/"
DEFAULT_GROUP = "131-ИБо"
# Username бота без @ — нужен для формирования t.me ссылки в настройках сайта.
# Установите своего бота через @BotFather и впишите его username сюда.
TG_BOT_USERNAME = "kampussgubot"

# Telegram bot token — НЕ хранится в репозитории. Устанавливается через:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
# Используется env.TELEGRAM_BOT_TOKEN.

# Owner-код —_SECRET. Устанавливается через:
#   npx wrangler secret put OWNER_CODE
# Любая строка. При вводе этого кода в Настройках пользователь получает
# права owner: может создавать/отзывать ссылки-приглашения для любой группы.
# Без него первая ссылка не создаётся. Используется env.OWNER_CODE.

# Канонический origin для ссылок-приглашений. Ссылки формируются как
# ${INVITE_ORIGIN}/#invite=<token> (hash-формат, не попадает в логи серверов),
# то есть открываются на фронтенде (Pages), а не на Worker (workers.dev).
# Укажите свой Pages-URL.
INVITE_ORIGIN = "https://kampussgu.dpdns.org"

# CORS: дополнительные разрешённые origin'ы для браузерных запросов к /api/*
# (через запятую, например "https://sched.example.ru"). Preview-домены
# *.schedule-worker.pages.dev разрешены ТОЛЬКО при ALLOW_PREVIEW_CORS === 'true'
# (см. ниже). Same-origin и curl (без Origin) в списке не нуждаются. ВАЖНО:
# этот список кэшируется CDN'ом — меняйте его только вместе с деплоем воркера.
ALLOWED_ORIGINS = "https://translated.turbopages.org"

# CORS для preview-доменов *.schedule-worker.pages.dev.
# "false" (или отсутствие) — вилдкард выключен, превью-сборки НЕ работают
# с прод-API. Для локальной разработки включать в .dev.vars. На проде
# держать выключенным; менять на "true" только временно, когда нужно
# проверить превью-сборку против прод-API.
ALLOW_PREVIEW_CORS = "false"

# Логирование производительности D1 (для анализа тормозов):
#   LOG_DB=0          — отключить всё логирование БД
#   LOG_DB_VERBOSE=1  — логировать КАЖДЫЙ запрос отдельно ([db] get key 3ms)
#   по умолчанию — только сводка на действие ([db-summary] ... totalMs=...)
LOG_DB = "1"
LOG_DB_VERBOSE = "0"

[[kv_namespaces]]
binding = "SCHEDULE"
id = "d4bf1890a6e94b5285f1c5195aed419a"

# D1 — основное хранилище (миграция с KV). Биндинг SCHEDULE оставлен
# для возможности отката; он не используется кодом после миграции.
#
# Создать базу и применить схему (один раз):
#   npx wrangler d1 create schedule-db
#   npx wrangler d1 execute schedule-db --remote --file=./migrations/0001_init.sql
#   npx wrangler d1 execute schedule-db --local  --file=./migrations/0001_init.sql
# Затем вписать database_id из вывода create в поле ниже.
[[d1_databases]]
binding = "DB"
database_name = "schedule-db"
database_id = "112c8d69-042c-42a2-8f0e-601c4ebb939c"

# Кастомный домен kampussgu.dpdns.org — это Pages (статика). Чтобы /api/*
# уходил в Worker, а не в статику, привязываем route к custom domain.
routes = [
  { pattern = "kampussgu.dpdns.org/api/*", custom_domain = true }
]

# Ежедневная очистка протухших записей (в KV TTL работал сам).
[triggers]
crons = ["23 4 * * *"]
