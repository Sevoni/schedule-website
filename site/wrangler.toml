name = "schedule-worker"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
CAMPUS_URL = "https://campus.syktsu.ru/schedule/group/"
DEFAULT_GROUP = "131-ИБо"
# Username бота без @ — нужен для формирования t.me ссылки в настройках сайта.
# Установите своего бота через @BotFather и впишите его username сюда.
TG_BOT_USERNAME = "kampussgubot"

# Telegram bot token — НЕ хранится в репозитории. Устанавливается через:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
# Используется env.TELEGRAM_BOT_TOKEN.

# Owner-код —_SECRET. Устанавливается через:
#   npx wrangler secret put OWNER_CODE
# Любая строка. При вводе этого кода в Настройках пользователь получает
# права owner: может создавать/отзывать ссылки-приглашения для любой группы.
# Без него первая ссылка не создаётся. Используется env.OWNER_CODE.

# Канонический origin для ссылок-приглашений. Ссылки формируются как
# ${INVITE_ORIGIN}/?token=<uuid>, то есть открываются на фронтенде (Pages),
# а не на Worker (workers.dev). Укажите свой Pages-URL.
INVITE_ORIGIN = "https://schedule-worker.pages.dev"

[[kv_namespaces]]
binding = "SCHEDULE"
id = "d4bf1890a6e94b5285f1c5195aed419a"

# D1 — основное хранилище (миграция с KV). Биндинг SCHEDULE оставлен
# для возможности отката; он не используется кодом после миграции.
#
# Создать базу и применить схему (один раз):
#   npx wrangler d1 create schedule-db
#   npx wrangler d1 execute schedule-db --remote --file=./migrations/0001_init.sql
#   npx wrangler d1 execute schedule-db --local  --file=./migrations/0001_init.sql
# Затем вписать database_id из вывода create в поле ниже.
[[d1_databases]]
binding = "DB"
database_name = "schedule-db"
database_id = "REPLACE_WITH_D1_ID"

# Ежедневная очистка протухших записей (в KV TTL работал сам).
[triggers]
crons = ["23 4 * * *"]
