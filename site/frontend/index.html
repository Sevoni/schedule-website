<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание — 131-ИБо</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>📅 Расписание</h1>
        <div style="display:flex;align-items:center;gap:8px;">
          <button id="syncBtn" class="icon-btn" title="Синхронизировать">🔄</button>
          <button id="settingsBtn" class="icon-btn" title="Настройки">⚙️</button>
        </div>
      </div>
      <div id="syncStatus" class="sync-status"></div>
      <div class="group-info">
        <span id="groupName">131-ИБо</span>
        <span id="weekRange" class="week-range"></span>
      </div>
    </header>

    <nav id="weekNav" class="week-nav">
      <button id="prevWeek" class="nav-btn">◀</button>
      <span id="weekLabel">Загрузка...</span>
      <button id="nextWeek" class="nav-btn">▶</button>
    </nav>

    <nav id="dayTabs" class="day-tabs"></nav>

    <main id="scheduleContent" class="schedule-content">
      <div class="loading">Загрузка расписания...</div>
    </main>

    <section id="homeworkSection" class="homework-section">
      <div class="homework-header">
        <h2>📝 Домашние задания</h2>
        <button id="addHomeworkBtn" class="add-btn">+ Добавить</button>
      </div>
      <div id="homeworkList" class="homework-list"></div>
    </section>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button id="closeSettings" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <label>
          Группа
          <input type="text" id="groupInput" placeholder="131-ИБо">
        </label>
        <label>
          API URL (Worker)
          <input type="text" id="apiUrlInput" placeholder="https://your-worker.workers.dev">
        </label>
        <label class="settings-toggle">
          <input type="checkbox" id="campusToggle">
          <span>Загружать расписание с campus.syktsu.ru</span>
        </label>
        <div class="settings-note">
          Если загрузка из кампуса отключена, расписание берётся только из БД.
          Нажмите 🔄 для принудительной синхронизации (только когда нагрузка с кампуса включена).
        </div>
        <button id="saveSettings" class="save-btn">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="homeworkModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Новое задание</h2>
        <button id="closeHomework" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <label>
          Предмет
          <select id="hwSubject"></select>
        </label>
        <div id="hwPairTypeWrap">
          <label>
            Тип пары
            <select id="hwPairType">
              <option value="any">Любой</option>
              <option value="л">Лекция</option>
              <option value="пр">Практика</option>
              <option value="пз">Практическое занятие</option>
              <option value="лаб">Лабораторная</option>
              <option value="с">Семинар</option>
              <option value="зчО">Зачёт с оценкой</option>
              <option value="зач">Зачёт</option>
              <option value="экз">Экзамен</option>
            </select>
          </label>
        </div>
        <div id="hwSubjectCustomWrap" class="hidden">
          <label>
            Название предмета
            <input type="text" id="hwSubjectCustom" placeholder="Математика">
          </label>
        </div>
        <label>
          Задание
          <textarea id="hwTask" rows="3" placeholder="Выполнить упражнения 1-5..."></textarea>
        </label>
        <div class="hw-due-mode">
          <label class="hw-mode-radio">
            <input type="radio" name="hwDueMode" value="nextPair">
            <span>Следующая пара</span>
          </label>
          <label class="hw-mode-radio">
            <input type="radio" name="hwDueMode" value="date">
            <span>Дата</span>
          </label>
        </div>
        <div id="hwDateWrap" class="hw-calendar-wrap hidden">
          <div class="hw-calendar">
            <div class="hw-cal-header">
              <button type="button" id="hwCalPrev">◀</button>
              <span id="hwCalTitle"></span>
              <button type="button" id="hwCalNext">▶</button>
            </div>
            <div class="hw-cal-grid" id="hwCalGrid"></div>
          </div>
          <div class="hw-date-selected">Выбрано: <span id="hwDateSelected">—</span></div>
        </div>
        <label>
          Автор
          <input type="text" id="hwAuthor" placeholder="Ваше имя (необязательно)">
        </label>
        <button id="saveHomework" class="save-btn">Добавить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
